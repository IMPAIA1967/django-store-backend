<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Интернет-магазин{% endblock %}</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background: #333; color: white; padding: 1rem; text-align: center; }
        nav { background: #444; padding: 0.5rem; }
        nav a { color: white; margin: 0 15px; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        main { padding: 20px; }
        footer { background: #333; color: white; text-align: center; padding: 1rem; margin-top: 20px; }
    </style>
</head>
<body>

<!-- Сообщения -->
{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}
{% endif %}

<!-- Шапка -->
<header>
    <h1>Интернет-магазин "ТехноКнигоОдежда"</h1>
</header>

<!-- Меню -->
{% include 'includes/menu.html' %}

<!-- Основной контент -->
<main>
    {% block content %}
    {% endblock %}
</main>

<!-- Подвал -->
<footer>
    <p>&copy; 3035 Магазин. Все права защищены.</p>
</footer>

</body>
</html>
