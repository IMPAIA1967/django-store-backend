<!-- templates/includes/menu.html -->
<nav style="display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 1rem; background: #444;">
    <div>
        <a href="{% url 'catalog:home' %}" style="color: white; text-decoration: none; margin-right: 15px;">Главная</a>
        {% if user.is_authenticated %}
            <a href="{% url 'catalog:product_create' %}" style="color: lightblue; text-decoration: none; margin-right: 15px;">Добавить товар</a>
        {% endif %}
    </div>

    <div style="display: flex; align-items: center;">
        {% if user.is_authenticated %}
            <!-- Аватарка -->
            {% if user.avatar %}
                <img src="{{ user.avatar.url }}" alt="Аватар" style="width: 32px; height: 32px; border-radius: 50%; margin-right: 8px; object-fit: cover;">
            {% else %}
                <div style="
                    width: 32px;
                    height: 32px;
                    border-radius: 50%;
                    background: #6c757d;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    color: white;
                    font-size: 12px;
                    font-weight: bold;
                    margin-right: 8px;">
                    {{ user.email|slice:":1"|upper }}
                </div>
            {% endif %}
            <span style="color: white; margin-right: 10px;">Привет, {{ user.email }}!</span>

            <!-- ИСПРАВЛЕННАЯ КНОПКА ВЫХОДА -->
            <form method="post" action="{% url 'users:logout' %}" style="display: inline; margin: 0;">
                {% csrf_token %}
                <button type="submit" style="
                    background: none;
                    border: none;
                    color: #ff6b6b;
                    text-decoration: none;
                    cursor: pointer;
                    font: inherit;
                    padding: 0;
                    margin: 0;">
                    Выйти
                </button>
            </form>

        {% else %}
            <a href="{% url 'users:register' %}" style="color: white; text-decoration: none; margin-right: 10px;">Регистрация</a>
            <a href="{% url 'users:login' %}" style="color: white; text-decoration: none;">Войти</a>
        {% endif %}
    </div>
</nav>
