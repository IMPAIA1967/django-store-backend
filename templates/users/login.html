{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Вход</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-success">Войти</button>
    </form>
    <p class="mt-3">
        Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрироваться</a>
    </p>
</div>
{% endblock %}
